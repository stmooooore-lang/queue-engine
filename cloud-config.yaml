  - model_name: plexus-act
    litellm_params:
      model: "nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b"
      rpm: 40
      api_key: os.environ/NVIDIA_API_KEY

router_settings:
  routing_strategy: usage-based-routing-v2
  num_retries: 3
  timeout: 600
  allowed_fails: 2
  cooldown_time: 60
  fallbacks:
    - plexus-architect: ["plexus-gemini", "plexus-cheap"]
    - plexus-judge: ["plexus-architect"]
    - plexus-act:  ["plexus-coder", "plexus-cheap"]
    - plexus-coder: ["plexus-groq"]
    - plexus-groq: ["plexus-architect"]
    - plexus-plan: ["plexus-architect"]


litellm_settings:
  drop_params: true
  set_verbose: false

  callbacks: plexus_hooks.proxy_handler_instance

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
