model_list:
- model_name: plexus-judge
  litellm_params:
    model: vertex_ai/gemini-2.5-pro
    rpm: 10
    vertex_project: os.environ/VERTEX_PROJECT
    vertex_location: us-central1
    vertex_credentials: os.environ/VERTEX_CREDENTIALS_JSON
- model_name: plexus-judge
  litellm_params:
    model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
    rpm: 40
    api_key: os.environ/NVIDIA_API_KEY
- model_name: plexus-architect
  litellm_params:
    model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
    rpm: 40
    api_key: os.environ/NVIDIA_API_KEY
- model_name: plexus-coder
  litellm_params:
    model: groq/openai/gpt-oss-120b
    rpm: 30
    tpm: 8000
    max_tokens: 8000
    api_key: os.environ/GROQ_API_KEY
# ADDED 2026-08-30: plexus-coder had only the single Groq deployment above,
# sharing GROQ_API_KEY's org-level rate limit with both plexus-cheap
# deployments (same key, three deployments, one shared pool - confirmed via
# a real crash today: "Worker local total request limit reached (33/32)").
# These two mirror what already exists (commented out, quota-exhausted)
# in Plexus's own local config.yaml for the same model_name - restoring
# them here gives plexus-coder a non-Groq path so it stops sharing fate
# with plexus-cheap on every Groq throttle.
- model_name: plexus-coder
  litellm_params:
    model: mistral/devstral-2512
    rpm: 50
    tpm: 50000
    api_key: os.environ/MISTRAL_API_KEY
- model_name: plexus-coder
