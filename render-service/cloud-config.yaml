router_settings:
  routing_strategy: usage-based-routing-v2
  num_retries: 3
  timeout: 600
  allowed_fails: 2
  cooldown_time: 60
  fallbacks:
  - plexus-architect:
    - plexus-gemini
    - plexus-cheap
  - plexus-judge:
    - plexus-architect
  - plexus-act:
    - plexus-gemini-lite
    - plexus-coder
    - plexus-cheap
  - plexus-cheap:
    - plexus-gemini-lite
  # ADDED 2026-08-30: litellm only follows ONE fallback hop per request
  # unless the group it lands on has its own fallback entry - plexus-act's
  # own list above already says "gemini-lite, then coder, then cheap," but
  # without this a gemini-lite failure (a real Vertex 503 "high demand,"
  # confirmed structural/documented on Google's own side, not our bug) was
  # a dead end even though coder was sitting right there in the same list
  # - this is what a founder's "gemini" retry button actually hit today.
  # Deliberately NOT cheap here: plexus-cheap's own fallback (above)
  # already points back to plexus-gemini-lite, so adding cheap would ping
  # gemini-lite -> cheap -> gemini-lite again on the same failed provider
  # instead of terminating - coder has no such loop back.
  - plexus-gemini-lite:
    - plexus-coder
  - plexus-plan:
    - plexus-architect


litellm_settings:
  drop_params: true
  set_verbose: false

  callbacks: plexus_hooks.proxy_handler_instance

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
