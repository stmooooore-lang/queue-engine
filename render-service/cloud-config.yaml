model_list:
- model_name: plexus-judge
  litellm_params:
    model: vertex_ai/gemini-2.5-pro
    rpm: 10
    vertex_project: os.environ/VERTEX_PROJECT
    vertex_location: us-central1
    vertex_credentials: os.environ/VERTEX_CREDENTIALS_JSON
- model_name: plexus-judge
  litellm_params:
    model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
    rpm: 40
    api_key: os.environ/NVIDIA_API_KEY
# 2026-08-31: same deployment/credential as plexus-judge above, SAME
# trial-credit pool (Vertex billing is per-project, not per litellm
# model_name). rpm kept at 5, lower than judge's 10, so research bursts
# cannot outrun judge's own reserved share of the credit. Kept consistent
# with the identical addition in the local repo's config.yaml.
- model_name: plexus-research
  litellm_params:
    model: vertex_ai/gemini-2.5-pro
    rpm: 5
    vertex_project: os.environ/VERTEX_PROJECT
    vertex_location: us-central1
    vertex_credentials: os.environ/VERTEX_CREDENTIALS_JSON
# 2026-08-31: same addition as local config.yaml - two independent
# outside-expert reviews ranked Claude as the most loop-resistant family
# for long agentic Cline sessions. Confirmed live in this GCP project
# (`gcloud ai model-garden models list`, CAN_PREDICT: Yes for
# claude-sonnet-5@default). Same Vertex project/creds as every other
# Vertex entry here, but a separate cost line from the Gemini trial
# credit - Anthropic-on-Vertex bills independently.
- model_name: plexus-claude
  litellm_params:
    model: vertex_ai/claude-sonnet-5@default
    vertex_project: os.environ/VERTEX_PROJECT
    vertex_location: us-central1
    vertex_credentials: os.environ/VERTEX_CREDENTIALS_JSON
- model_name: plexus-architect
  litellm_params:
    model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
    rpm: 40
    api_key: os.environ/NVIDIA_API_KEY
- model_name: plexus-coder
  litellm_params:
    model: groq/openai/gpt-oss-120b
    rpm: 30
    tpm: 8000
    max_tokens: 8000
    api_key: os.environ/GROQ_API_KEY
# ADDED 2026-08-30: plexus-coder had only the single Groq deployment above,
# sharing GROQ_API_KEY's org-level rate limit with both plexus-cheap
# deployments (same key, three deployments, one shared pool - confirmed via
# a real crash today: "Worker local total request limit reached (33/32)").
# These two mirror what already exists (commented out, quota-exhausted)
# in Plexus's own local config.yaml for the same model_name - restoring
# them here gives plexus-coder a non-Groq path so it stops sharing fate
# with plexus-cheap on every Groq throttle.
# [mistral quota policy 2026-08-31, resets 2026-09-01] - HTTP 402 "Check
# your subscription" confirmed live (not a guess): Free-plan $10/mo API
