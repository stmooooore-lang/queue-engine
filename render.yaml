services:
  - type: web
    name: render-service
    rootDir: render-service
    env: docker
    dockerfilePath: ./Dockerfile.litellm
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: VERTEX_PROJECT
        sync: false
      - key: VERTEX_CREDENTIALS_JSON
        sync: false
      - key: LITELLM_MASTER_KEY
        sync: false
