name: probe

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Text to echo back'
        required: false
        default: 'hello from the cloud'
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: write input to a file
        run: echo "${{ inputs.message }}" > result.txt

      - name: show it
        run: cat result.txt

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: probe-result
          path: result.txt
