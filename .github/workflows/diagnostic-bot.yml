name: diagnostic-bot

# Purely mechanical, no LLM involved - deliberately. TELEGRAM_BOT_TOKEN and
# CLOUDFLARE_API_TOKEN are never given to the coding-agent step in
# cloud-agent.yml on purpose (see CLOUD-KEYS.md / the secrets matrix in
# docs/queue-engine-cloud-hosting-pattern.md - only the pieces that
# actually need to talk to Telegram/Cloudflare get those tokens). Added
# 2026-08-29 after cloud-agent.yml's own investigation ran into exactly
# that wall trying to check webhook/Worker health from inside the agent
# step. This workflow checks the same two things as a plain bash step
# instead - deterministic, no secret ever reaches a model.
#
# UPDATED same day: the GitHub-stored TELEGRAM_BOT_TOKEN secret is a dead,
# unused copy - neither the Worker (deploys via Cloudflare's own wrangler
# secret store) nor the poller (reads /run/secrets/poller.env on the VM)
# ever consult it. The owner rotated the real token on the VM side
# yesterday; this check now reads THAT copy over SSH instead, so it
# reflects what the live bot actually uses.

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Telegram webhook status, using the VM's own current token
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$GCP_SA_KEY" > /tmp/gcp-key.json
          gcloud auth activate-service-account --key-file=/tmp/gcp-key.json --project="$GCP_PROJECT_ID"
          # Token never leaves the VM in a log line or a --command string:
          # the whole curl+parse happens inside the remote shell, and only
          # the safe getWebhookInfo JSON (no secret in it) comes back.
          gcloud compute ssh runner@plexus-queue-vm --zone=us-central1-a --project="$GCP_PROJECT_ID" \
            --command='TOKEN=$(sudo grep "^TELEGRAM_BOT_TOKEN=" /run/secrets/poller.env | cut -d= -f2-); curl -fsS "https://api.telegram.org/bot${TOKEN}/getWebhookInfo" | python3 -m json.tool'

      - name: Cloudflare Worker - recent deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/worker" 2>/dev/null || { echo "no worker/ dir at repo root - skipping"; exit 0; }
          npm i -g wrangler@latest --silent
          wrangler deployments list 2>&1 | tail -30 || echo "wrangler deployments list failed - see output above"

      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Turso - most recent task, whatever its age
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          npm install --no-save @libsql/client --silent
          node -e '
            const { createClient } = require("@libsql/client");
            const db = createClient({ url: process.env.TURSO_DATABASE_URL, authToken: process.env.TURSO_AUTH_TOKEN });
            db.execute({ sql: "SELECT id, status, created_at, creator_id, lane FROM tasks ORDER BY created_at DESC LIMIT 5", args: [] })
              .then(r => { console.log("server UTC now:", new Date().toISOString()); console.log(JSON.stringify(r.rows, null, 2)); })
              .catch(e => { console.error("query failed:", e.message); process.exit(1); });
          '
