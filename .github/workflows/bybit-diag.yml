name: bybit-diag
on: {workflow_dispatch: {}}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: try every bybit host and a few alternatives
        run: |
          Q="v5/market/kline?category=linear&symbol=BTCUSDT&interval=60&limit=2"
          for H in api.bybit.com api.bytick.com api.bybit.nl api-testnet.bybit.com; do
            C=$(curl -s -o /tmp/b.txt -w "%{http_code}" --max-time 15 "https://$H/$Q" || echo ERR)
            printf "%-24s %s  %s\n" "$H" "$C" "$(head -c 90 /tmp/b.txt | tr -d '\n')"
          done
          echo "--- other exchanges, same data ---"
          for U in "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=2" \
                   "https://api.kraken.com/0/public/OHLC?pair=XBTUSD&interval=60" \
                   "https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=3600" \
                   "https://api.okx.com/api/v5/market/candles?instId=BTC-USDT&bar=1H&limit=2"; do
            C=$(curl -s -o /tmp/e.txt -w "%{http_code}" --max-time 15 "$U" || echo ERR)
            printf "%-22s %s  %s\n" "$(echo $U | cut -d/ -f3)" "$C" "$(head -c 80 /tmp/e.txt | tr -d '\n')"
          done
