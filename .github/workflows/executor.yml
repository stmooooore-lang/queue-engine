name: Task Executor

# Runs one queued task from Turso as a real dsh turn against plexus-doc/ (the
# real product repo, checked out fresh each run - see the 2026-09-13 comment
# below), and
# reports back to Telegram.
#
# 2026-09-12: model-calling layer changed from cline + a local litellm proxy
# to dsh, calling real providers (Groq/NVIDIA/Mistral) directly - no proxy in
# front of it. Everything else (Turso claim/write, Telegram notify, the
# plexus/ confinement check below) is unchanged. See docs/DECISIONS.md in
# the founder's "Continue MODELS integration" project for the real
# provider-config schema this was built and tested against, and the real
# bugs found along the way (litellm routing prefixes on model ids; dsh
# validates every REGISTERED provider's credential at boot, not just the
# selected one).

on:
  workflow_dispatch:
    inputs:
      taskId:
        description: 'Task id to execute'
        required: true

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Create headless dsh profile directory (required for dsh to initialize
      # its profile structure before Node.js setup runs)
      - name: create headless dsh profile directory
        run: |
          mkdir -p ~/.dsh/profiles/headless
          if [ ! -d ~/.dsh/profiles/headless ]; then
            echo "FAIL: headless profile directory was not created"
            exit 1
          fi
          echo "OK: headless profile directory exists at ~/.dsh/profiles/headless"

      # 2026-09-13: real gap found via plexus-doc-ce's task 11 - dsh only had
      # `plexus/`, a partial snapshot checked into this repo (see the header
      # of plexus-corridor.yml: "the cloud is a worker, not a git client").
      # Task briefs assuming the real repo (notes/, site/engine/, etc) failed
      # with a real no_access diagnost verdict, not a hallucination - founder
      # decided the queue should see the real repo, not the stale snapshot.
      # This is READ visibility only - same REPO_TOKEN cloud-agent.yml already
      # uses for its own (separate, push-capable) checkout of this repo. No
      # push/commit step is added here: still a worker, not a git client -
      # if a task needs to leave a durable product change, that goes through
      # cloud-agent.yml, not this queue.
      - uses: actions/checkout@v4
        with:
          repository: stmooooore-lang/plexus-doc
          token: ${{ secrets.REPO_TOKEN }}
          path: plexus-doc

      # 2026-09-12: real bug hunt, FOUR dead ends before the actual fix -
      # keeping the record since the true cause was non-obvious.
      # 1) First guess (via plexus-doc-ce's first live dispatch, task 95):
      #    assumed the "headless" profile just needed its 3 metadata files
      #    (package.json/cordis.yml/cordis.patch.yml) hand-written here.
      #    Wrong AND unnecessary - a follow-up attempt to `npm install` the
      #    bundle packages into the profile dir also failed outright (404
      #    on a private, unpublished transitive dep, @deepseek-ai/dsh-bash-env).
      # 2) Assumed dsh's own auto-init of the headless profile (real, shipped
      #    behavior per its README) needed to be left alone - true in
      #    general, but NOT this bug's cause: reverting to pure auto-init
      #    still produced the exact same symptom on real CI re-tests.
      # 3) Investigated Linux-specific sandboxing (Landlock) as the cause,
      #    since dsh ships a real `@deepseek-ai/node-addon-system` Landlock
      #    launcher for Linux with none of that on macOS (where the same
      #    command worked). Directly disproven: calling the launcher's own
      #    `probe()` on the real CI runner returned `"full"` - the sandbox
      #    backend works fine there, it was never the blocker.
      # 4) REAL ROOT CAUSE, confirmed directly: dsh's `bin.js` gates its
      #    entire CLI dispatch on `if (import.meta.main) await runCli();` -
      #    a real Node.js feature that only exists from Node 24 onward.
      #    This workflow pinned `actions/setup-node@v4` to `node-version:
      #    '20'`. On Node 20, `import.meta.main` is simply `undefined`
      #    (confirmed live on the actual runner) - so `runCli()` is NEVER
      #    called, dsh's imports all resolve correctly (confirmed via a
      #    `NODE_DEBUG=esm` trace) but the process does nothing and exits
      #    0 with zero bytes on stdout AND stderr, on every invocation
      #    (`--version`, `--help`, and a real `--profile headless` call
      #    all failed identically). Confirmed as the real, complete fix by
      #    re-running the exact same real `--profile headless` call on
      #    Node 24 on the SAME runner: it produced real output for the
      #    first time (`dsh: NO_ADAPTER: no adapter registered for
      #    provider "groq"` - a normal, expected error at that point since
      #    the diagnostic ran before provider settings were written -
      #    proving dsh's own CLI dispatch now actually executes).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: install the database client
        run: npm install --no-save @libsql/client

      # GHQ-EXEC-CACHE, 2026-09-12 (founder's own instruction - this was
      # blocked on "Plexus's queue going live", which just happened
      # tonight): real measurement showed `npm install -g
      # @deepseek-ai/dsh` alone was 65 of every 86s (75%) of a task run,
      # before any model call even started. Caches the global npm
      # install dir, keyed on a PINNED dsh version rather than "latest",
      # so the cache never goes stale silently AND a future dsh release
      # can't silently change behavior underneath already-verified work -
      # a version bump becomes a deliberate, visible edit to this file.
      #
      # 2026-09-30: pin changed 0.1.5-rc.1 -> 0.1.5-rc.3. Real cause of
      # task 64's block (run 36687803570), reproduced offline on macOS:
      # `npm install -g @deepseek-ai/dsh@0.1.5-rc.1` installs the CORE at
      # 0.1.5-rc.1 but resolves every `@deepseek-ai/dsh-*` dependency
      # through its own caret range `^0.1.5-rc.1`, which npm satisfies
      # with 0.1.5-rc.3. That mixed tree (core rc.1 + plugins rc.3) boots
      # no headless profile at all: the sandbox entry never gets a Cordis
      # fiber and dsh exits 1 with "plugin(s) failed to load:
      # @deepseek-ai/dsh-sandbox-local". Pinning the MATCHED version keeps
      # core and plugins on the same build; 0.1.5-rc.3 was verified
      # booting a real `--profile headless --patch` run before this edit.
      - name: get npm global paths
        id: npm-global
        run: |
          echo "root=$(npm root -g)" >> "$GITHUB_OUTPUT"
          echo "bin=$(npm config get prefix)/bin" >> "$GITHUB_OUTPUT"

      # 2026-09-12: real bug found via plexus-doc-ce's live dispatch -
      # caching ONLY `npm root -g` (lib/node_modules, the package code)
      # left the actual `dsh` EXECUTABLE missing after a cache hit: `npm
      # install -g` also creates a bin symlink in a SIBLING directory
      # (`npm bin -g`, e.g. .../x64/bin/dsh), which lives outside
      # node_modules and was never being cached - "Cache restored
      # successfully" was real and true, just for the wrong half of what
      # a global npm install actually creates. Both paths cached now.
      - name: cache dsh global install
        id: dsh-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.npm-global.outputs.root }}
            ${{ steps.npm-global.outputs.bin }}
          key: dsh-global-${{ runner.os }}-node24-0.1.5-rc.3-v3

      - name: install dsh
        if: steps.dsh-cache.outputs.cache-hit != 'true'
        run: npm install -g @deepseek-ai/dsh@0.1.5-rc.3 --silent

      - name: verify dsh is real after cache/install
        run: |
          which dsh
          dsh --version

      # 2026-10-03: post-install tree-homogeneity guard. The pinned core
      # does not pin its @deepseek-ai/dsh-* dependencies (the package
      # manifest carries caret ranges ^0.1.5-rc.3), so npm resolves them
      # on its own. Today that lands on exactly 0.1.5-rc.3 because the
      # 0.1.5 line ends there - a coincidence of the registry, not a
      # guarantee: when rc.4 (or a 0.1.5 stable) is published, the caret
      # leaks and the rc.1 mixed-tree bug class returns. This step checks
      # the INSTALLED tree by fact, not by range: every @deepseek-ai/dsh*
      # package must be at the core's own version. A mismatch fails the
      # job before any task runs.
      - name: verify dsh tree is homogeneous
        run: |
          root=$(npm root -g)
          core=$(node -e "console.log(require(process.argv[1]).version)" "$root/@deepseek-ai/dsh/package.json")
          echo "core dsh version: $core"
          bad=$(find "$root/@deepseek-ai" -maxdepth 2 -name package.json | while read -r p; do
            name=$(node -e "console.log(require(process.argv[1]).name)" "$p" 2>/dev/null) || continue
            case "$name" in
              @deepseek-ai/dsh|@deepseek-ai/dsh-*) ;;
              *) continue ;;
            esac
            v=$(node -e "console.log(require(process.argv[1]).version)" "$p" 2>/dev/null)
            [ "$v" != "$core" ] && echo "$name@$v"
          done)
          if [ -n "$bad" ]; then
            echo "FAIL: mixed dsh tree - core $core, mismatched packages:"
            echo "$bad"
            exit 1
          fi
          echo "OK: dsh tree homogeneous - every @deepseek-ai/dsh* package at $core"

      # 2026-09-30: `dsh --version` was the ONLY dsh check this workflow
      # made, and it passes on a dsh whose headless profile cannot boot at
      # all - exactly how task 64's real blocker (a plugin tree that does
      # not resolve) stayed invisible here while the job stayed green. This
      # step starts a real headless profile with the same profile/patch
      # shape executor.mjs uses. A registered-but-dummy provider makes the
      # turn fail at AUTH, which is the EXPECTED, healthy outcome: reaching
      # a provider error proves the whole plugin tree mounted. The one
      # outcome treated as fatal is the plugin tree itself failing to load.
      - name: smoke-test that the headless profile actually boots
        run: |
          mkdir -p ~/.dsh/profiles/headless
          cat > ~/.dsh/settings.yaml << 'SETTINGS'
          llm-pi-ai:
            providers:
              nvidia:
                apiKeyEnv: NVIDIA_API_KEY
                api: openai-completions
                baseURL: https://integrate.api.nvidia.com/v1
                models:
                  - id: nvidia/nemotron-3-ultra-550b-a55b
          SETTINGS
          printf -- '- id: agent-default-model\n  config:\n    provider: nvidia\n    model: nvidia/nemotron-3-ultra-550b-a55b\n' > /tmp/boot-check-patch.yml
          set +e
          NVIDIA_API_KEY=dsh-boot-check-not-a-real-key \
            dsh --profile headless --patch /tmp/boot-check-patch.yml "boot check" > /tmp/boot-check.log 2>&1
          boot_status=$?
          set -e
          if grep -q "plugin(s) failed to load\|plugin tree failed to load" /tmp/boot-check.log; then
            echo "FAIL: the headless profile does not boot - plugin tree failed to load:"
            tail -25 /tmp/boot-check.log
            exit 1
          fi
          echo "OK: headless profile booted (exit $boot_status, no plugin-tree failure)"
          tail -5 /tmp/boot-check.log

      # dsh reads a fixed global path, ~/.dsh/settings.yaml - no CLI flag
      # selects it. Same registry shape as this repo's own worker uses
      # locally (real, curl-confirmed model ids - no litellm routing
      # prefixes; NVIDIA's own "nvidia/" prefix is real, not litellm's).
      - name: write dsh direct-provider settings
        run: |
          mkdir -p ~/.dsh
          cat > ~/.dsh/settings.yaml << 'SETTINGS'
          llm-pi-ai:
            providers:
              groq:
                apiKeyEnv: GROQ_API_KEY
                api: openai-completions
                baseURL: https://api.groq.com/openai/v1
                models:
                  - id: openai/gpt-oss-120b
              nvidia:
                apiKeyEnv: NVIDIA_API_KEY
                api: openai-completions
                baseURL: https://integrate.api.nvidia.com/v1
                models:
                  - id: nvidia/nemotron-3-ultra-550b-a55b
              mistral:
                apiKeyEnv: MISTRAL_API_KEY
                api: openai-completions
                baseURL: https://api.mistral.ai/v1
                models:
                  - id: mistral-medium-3-5
          SETTINGS

      - name: run the task
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TASK_ID: ${{ inputs.taskId }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: node scripts/executor.mjs

      - name: nothing outside plexus/ or plexus-doc/ may have changed
        if: always()
        run: |
          # The executor is confined to plexus/ (this repo's own snapshot) and
          # now also plexus-doc/ (2026-09-13: real checkout of the actual
          # product repo, see the checkout step above - a SEPARATE git repo,
          # so this outer `git status` sees it as one collapsed untracked
          # `?? plexus-doc/` line, not its individual files - confirmed by a
          # real local test with a nested git repo before relying on it).
          # This checks the confinement rather than trusting it: a task
          # arriving from a messenger should never be able to touch the
          # workflow that runs it, the worker, or anything else in this repo.
          changed=$(git status --porcelain | awk '{print $2}' | grep -v '^plexus/' | grep -v '^plexus-doc/' || true)
          if [ -n "$changed" ]; then
            echo "ГРАНИЦА НАРУШЕНА — тронуто вне plexus/ и plexus-doc/:"
            echo "$changed"
            exit 1
          fi
          echo "граница цела: изменения только внутри plexus/ и/или plexus-doc/"