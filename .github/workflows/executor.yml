name: Task Executor

# Runs one queued task from Turso as a Cline agent turn, and reports back to
# Telegram.
#
# The proxy+cline setup mirrors cloud-agent.yml exactly - same litellm pin,
# same providers.json shape - so a task from the phone gets the same lane map
# as a task typed directly into cloud-agent. scripts/executor.mjs owns the
# Turso/Telegram plumbing; it shells out to `cline` once the proxy is up.

on:
  workflow_dispatch:
    inputs:
      taskId:
        description: 'Task id to execute'
        required: true

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install the database client
        run: npm install --no-save @libsql/client

      - name: install cline
        run: npm i -g cline --silent

      # Same pin, same reason as cloud-agent.yml: the unpinned litellm CLI
      # fails to import proxy_server on this runner (run 32549839784).
      - name: proxy with the real lanes
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          pip install --quiet "litellm[proxy]==1.83.9"
          python3 -c "import yaml;d=yaml.safe_load(open('cloud-config.yaml'));print('lanes:',sorted({m[\"model_name\"] for m in d[\"model_list\"]}))"
          nohup litellm --config cloud-config.yaml --port 4000 --host 127.0.0.1 --num_workers 1 > /tmp/proxy.log 2>&1 &
          sleep 5
          grep -q "ModuleNotFoundError" /tmp/proxy.log && { echo "прокси не стартовал:"; tail -20 /tmp/proxy.log; exit 1; }
          for i in $(seq 1 40); do
            curl -fsS -m 3 http://127.0.0.1:4000/health/liveliness >/dev/null 2>&1 && { echo "proxy up after $((i*3))s"; exit 0; }
            sleep 3
          done
          echo "proxy did not come up"; tail -20 /tmp/proxy.log; exit 1

      - name: provider config, exact shape of a working one
        run: |
          mkdir -p ~/.cline/data/settings
          python3 - <<'PY'
          import json, os, datetime
          cfg = {
            "version": 1,
            "lastUsedProvider": "openai-compatible",
            "providers": {"openai-compatible": {
                "settings": {
                    "provider": "openai-compatible",
                    "apiKey": "not-used-by-the-local-proxy",
                    "model": "plexus-act",
                    "baseUrl": "http://127.0.0.1:4000/v1",
                    "headers": {}},
                "updatedAt": datetime.datetime.utcnow().isoformat() + "Z",
                "tokenSource": "migration"}}}
          p = os.path.expanduser("~/.cline/data/settings/providers.json")
          open(p, "w").write(json.dumps(cfg))
          os.chmod(p, 0o600)
          PY

      - name: run the task
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TASK_ID: ${{ inputs.taskId }}
        run: node scripts/executor.mjs

      - name: nothing outside plexus/ may have changed
        if: always()
        run: |
          # The executor is confined to plexus/. This checks the confinement
          # rather than trusting it: a task arriving from a messenger should
          # never be able to touch the workflow that runs it, the worker, or
          # anything else in this repository.
          changed=$(git status --porcelain | awk '{print $2}' | grep -v '^plexus/' || true)
          if [ -n "$changed" ]; then
            echo "ГРАНИЦА НАРУШЕНА — тронуто вне plexus/:"
            echo "$changed"
            exit 1
          fi
          echo "граница цела: изменения только внутри plexus/"
