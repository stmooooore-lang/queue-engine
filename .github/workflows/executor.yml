name: Task Executor

# Runs one queued task from Turso as a real dsh turn against plexus/, and
# reports back to Telegram.
#
# 2026-09-12: model-calling layer changed from cline + a local litellm proxy
# to dsh, calling real providers (Groq/NVIDIA/Mistral) directly - no proxy in
# front of it. Everything else (Turso claim/write, Telegram notify, the
# plexus/ confinement check below) is unchanged. See docs/DECISIONS.md in
# the founder's "Continue MODELS integration" project for the real
# provider-config schema this was built and tested against, and the real
# bugs found along the way (litellm routing prefixes on model ids; dsh
# validates every REGISTERED provider's credential at boot, not just the
# selected one).

on:
  workflow_dispatch:
    inputs:
      taskId:
        description: 'Task id to execute'
        required: true

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install the database client
        run: npm install --no-save @libsql/client

      - name: install dsh
        run: npm install -g @deepseek-ai/dsh --silent

      - name: TEMP diagnostic - import.meta.main under Node 20 (live hypothesis)
        run: |
          echo "--- node version right now ---"
          node --version
          echo "--- import.meta.main value on this node ---"
          node -e "console.log('import.meta.main:', import.meta.main)" --input-type=module 2>&1 || \
            (echo "console.log('import.meta.main:', import.meta.main);" > /tmp/meta-check.mjs && node /tmp/meta-check.mjs)

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: TEMP diagnostic - REAL profile invocation under Node 24 (the actual fix, if hypothesis holds)
        run: |
          echo "--- node version now ---"
          node --version
          cat > /tmp/diag-patch3.yml << 'PATCH'
          - id: agent-default-model
            config:
              provider: groq
              model: openai/gpt-oss-120b
          PATCH
          cat > /tmp/wrap-dsh3.mjs << 'WRAP'
          import { spawn } from "node:child_process";
          const child = spawn("dsh", ["--profile", "headless", "--patch", "/tmp/diag-patch3.yml", "reply with just the word OK"], {
            cwd: "plexus",
            env: { ...process.env, DSH_PERMISSION_MODE: "danger-full-access", DSH_PROXY_DUMMY_KEY: "unused" },
          });
          let out = "", err = "";
          child.stdout.on("data", (d) => (out += d));
          child.stderr.on("data", (d) => (err += d));
          child.on("error", (e) => console.log("SPAWN ERROR EVENT:", e));
          child.on("close", (code, signal) => {
            console.log("CLOSE code:", code, "signal:", signal);
            console.log("STDOUT bytes:", out.length, JSON.stringify(out));
            console.log("STDERR bytes:", err.length, JSON.stringify(err));
          });
          WRAP
          node /tmp/wrap-dsh3.mjs
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # 2026-09-12: real bug hunt, three dead ends before the actual fix -
      # keeping the record since the true cause was non-obvious.
      # 1) First guess (via plexus-doc-ce's first live dispatch, task 95):
      #    assumed the "headless" profile just needed its 3 metadata files
      #    (package.json/cordis.yml/cordis.patch.yml) hand-written here.
      #    Wrong AND unnecessary - a follow-up attempt to `npm install` the
      #    bundle packages into the profile dir also failed outright (404
      #    on a private, unpublished transitive dep, @deepseek-ai/dsh-bash-env).
      # 2) Real cause, confirmed by actually reading dsh's own shipped
      #    README (`npm root -g`/@deepseek-ai/dsh/README.md - never checked
      #    it until told to): "web/headless/sdk/sdk-minimal/acp profiles
      #    auto-initialize on first use from shipped templates" - dsh is
      #    supposed to build the ENTIRE profile itself on first run,
      #    including a real, heavy dependency install
      #    (~/.dsh/profiles/node_modules - confirmed locally it pulls in
      #    dozens of packages, some native: sharp, koffi, node-pty).
      #    Hand-writing the 3 metadata files made dsh think the profile
      #    already existed and SKIP that real auto-init - leaving a
      #    profile that looked structurally correct under --dump-config
      #    but had none of the actual runtime dependencies, so the real
      #    agent boot silently produced nothing (exit 0, empty stdout AND
      #    stderr - confirmed locally with a byte-for-byte matching setup;
      #    key validity, NVIDIA/Mistral validity, and profile structure
      #    were all separately ruled out first).
      # Real fix: don't touch ~/.dsh/profiles at all. Let dsh auto-init it.

      # dsh reads a fixed global path, ~/.dsh/settings.yaml - no CLI flag
      # selects it. Same registry shape as this repo's own worker uses
      # locally (real, curl-confirmed model ids - no litellm routing
      # prefixes; NVIDIA's own "nvidia/" prefix is real, not litellm's).
      - name: write dsh direct-provider settings
        run: |
          mkdir -p ~/.dsh
          cat > ~/.dsh/settings.yaml << 'SETTINGS'
          llm-pi-ai:
            providers:
              groq:
                apiKeyEnv: GROQ_API_KEY
                api: openai-completions
                baseURL: https://api.groq.com/openai/v1
                models:
                  - id: openai/gpt-oss-120b
              nvidia:
                apiKeyEnv: NVIDIA_API_KEY
                api: openai-completions
                baseURL: https://integrate.api.nvidia.com/v1
                models:
                  - id: nvidia/nemotron-3-ultra-550b-a55b
              mistral:
                apiKeyEnv: MISTRAL_API_KEY
                api: openai-completions
                baseURL: https://api.mistral.ai/v1
                models:
                  - id: mistral-medium-3-5
          SETTINGS

      # TEMP DIAGNOSTIC, 2026-09-12: real dsh call, straight from bash, no
      # JS layer in between - executor.mjs's own dsh call has been
      # returning empty stdout+stderr with exit 0 on this exact runner
      # shape (confirmed: same command reproduces fine locally on macOS
      # with a fresh ~/.dsh, so the difference is something about THIS
      # Linux runner specifically - auto-init failing silently is the live
      # hypothesis). This step proves or disproves that directly, printed
      # straight into the Actions log, before removing it.
      - name: run the task
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TASK_ID: ${{ inputs.taskId }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: node scripts/executor.mjs

      - name: nothing outside plexus/ may have changed
        if: always()
        run: |
          # The executor is confined to plexus/. This checks the confinement
          # rather than trusting it: a task arriving from a messenger should
          # never be able to touch the workflow that runs it, the worker, or
          # anything else in this repository.
          changed=$(git status --porcelain | awk '{print $2}' | grep -v '^plexus/' || true)
          if [ -n "$changed" ]; then
            echo "ГРАНИЦА НАРУШЕНА — тронуто вне plexus/:"
            echo "$changed"
            exit 1
          fi
          echo "граница цела: изменения только внутри plexus/"
