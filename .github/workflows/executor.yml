name: Task Executor

# Runs one queued task from Turso as a real dsh turn against plexus/, and
# reports back to Telegram.
#
# 2026-09-12: model-calling layer changed from cline + a local litellm proxy
# to dsh, calling real providers (Groq/NVIDIA/Mistral) directly - no proxy in
# front of it. Everything else (Turso claim/write, Telegram notify, the
# plexus/ confinement check below) is unchanged. See docs/DECISIONS.md in
# the founder's "Continue MODELS integration" project for the real
# provider-config schema this was built and tested against, and the real
# bugs found along the way (litellm routing prefixes on model ids; dsh
# validates every REGISTERED provider's credential at boot, not just the
# selected one).

on:
  workflow_dispatch:
    inputs:
      taskId:
        description: 'Task id to execute'
        required: true

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install the database client
        run: npm install --no-save @libsql/client

      - name: install dsh
        run: npm install -g @deepseek-ai/dsh --silent

      # dsh reads a fixed global path, ~/.dsh/settings.yaml - no CLI flag
      # selects it. Same registry shape as this repo's own worker uses
      # locally (real, curl-confirmed model ids - no litellm routing
      # prefixes; NVIDIA's own "nvidia/" prefix is real, not litellm's).
      - name: write dsh direct-provider settings
        run: |
          mkdir -p ~/.dsh
          cat > ~/.dsh/settings.yaml << 'SETTINGS'
          llm-pi-ai:
            providers:
              groq:
                apiKeyEnv: GROQ_API_KEY
                api: openai-completions
                baseURL: https://api.groq.com/openai/v1
                models:
                  - id: openai/gpt-oss-120b
              nvidia:
                apiKeyEnv: NVIDIA_API_KEY
                api: openai-completions
                baseURL: https://integrate.api.nvidia.com/v1
                models:
                  - id: nvidia/nemotron-3-ultra-550b-a55b
              mistral:
                apiKeyEnv: MISTRAL_API_KEY
                api: openai-completions
                baseURL: https://api.mistral.ai/v1
                models:
                  - id: mistral-medium-3-5
          SETTINGS

      - name: run the task
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TASK_ID: ${{ inputs.taskId }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: node scripts/executor.mjs

      - name: nothing outside plexus/ may have changed
        if: always()
        run: |
          # The executor is confined to plexus/. This checks the confinement
          # rather than trusting it: a task arriving from a messenger should
          # never be able to touch the workflow that runs it, the worker, or
          # anything else in this repository.
          changed=$(git status --porcelain | awk '{print $2}' | grep -v '^plexus/' || true)
          if [ -n "$changed" ]; then
            echo "ГРАНИЦА НАРУШЕНА — тронуто вне plexus/:"
            echo "$changed"
            exit 1
          fi
          echo "граница цела: изменения только внутри plexus/"
