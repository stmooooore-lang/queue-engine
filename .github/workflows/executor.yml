name: Task Executor

# Runs one queued task from Turso as a real dsh turn against plexus/, and
# reports back to Telegram.
#
# 2026-09-12: model-calling layer changed from cline + a local litellm proxy
# to dsh, calling real providers (Groq/NVIDIA/Mistral) directly - no proxy in
# front of it. Everything else (Turso claim/write, Telegram notify, the
# plexus/ confinement check below) is unchanged. See docs/DECISIONS.md in
# the founder's "Continue MODELS integration" project for the real
# provider-config schema this was built and tested against, and the real
# bugs found along the way (litellm routing prefixes on model ids; dsh
# validates every REGISTERED provider's credential at boot, not just the
# selected one).

on:
  workflow_dispatch:
    inputs:
      taskId:
        description: 'Task id to execute'
        required: true

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install the database client
        run: npm install --no-save @libsql/client

      - name: install dsh
        run: npm install -g @deepseek-ai/dsh --silent

      # 2026-09-12 real bug, found via plexus-doc-ce's first live dispatch
      # (task 95): dsh's "headless" profile is not just a CLI flag - on a
      # real dsh install it's a whole real directory
      # (~/.dsh/profiles/headless/) with its own package.json (bundles
      # @deepseek-ai/dsh-base + @deepseek-ai/dsh-headless), cordis.yml, and
      # a cordis.patch.yml carrying a real, deliberate setting (restrict
      # agent-instructions to AGENTS.md only, so a background task never
      # picks up CLAUDE.md's admin-channel rules). None of that existed on
      # a fresh runner - executor.yml only ever wrote settings.yaml, so
      # `--profile headless` resolved to nothing and dsh exited 0 with
      # empty stdout, no error, no retry - looked like "success" in
      # Actions while doing nothing at all.
      #
      # Correction, same day: an earlier version of this step also ran
      # `npm install` for the two bundle packages into the profile dir -
      # wrong and unnecessary. `npm install -g @deepseek-ai/dsh` above
      # already installs dsh-base/dsh-headless/etc. as ITS OWN direct
      # dependencies (confirmed: they're listed in the installed dsh
      # package's own package.json) - a second, separate install for one
      # of them (dsh-headless) tried to pull a private, unpublished
      # transitive dep (@deepseek-ai/dsh-bash-env) straight from the
      # public registry and got a real 404. Just the 3 metadata files
      # below are needed; dsh resolves the bundles from its own already-
      # installed node_modules.
      - name: provision the real headless dsh profile
        run: |
          mkdir -p ~/.dsh/profiles/headless
          cat > ~/.dsh/profiles/headless/package.json << 'PKG'
          {
            "name": "dsh-profile-headless",
            "private": true,
            "dependencies": {},
            "dsh": {
              "profile": {
                "bundles": ["@deepseek-ai/dsh-base", "@deepseek-ai/dsh-headless"],
                "patchReload": "startup"
              }
            }
          }
          PKG
          echo '[]' > ~/.dsh/profiles/headless/cordis.yml
          cat > ~/.dsh/profiles/headless/cordis.patch.yml << 'PATCH'
          - id: agent-default-model
            config:
              provider: groq
              model: openai/gpt-oss-120b
          - id: agent-instructions
            config:
              maxBytes: 65536
              instructionFileCandidates: ["AGENTS.md"]
          PATCH

      # dsh reads a fixed global path, ~/.dsh/settings.yaml - no CLI flag
      # selects it. Same registry shape as this repo's own worker uses
      # locally (real, curl-confirmed model ids - no litellm routing
      # prefixes; NVIDIA's own "nvidia/" prefix is real, not litellm's).
      - name: write dsh direct-provider settings
        run: |
          mkdir -p ~/.dsh
          cat > ~/.dsh/settings.yaml << 'SETTINGS'
          llm-pi-ai:
            providers:
              groq:
                apiKeyEnv: GROQ_API_KEY
                api: openai-completions
                baseURL: https://api.groq.com/openai/v1
                models:
                  - id: openai/gpt-oss-120b
              nvidia:
                apiKeyEnv: NVIDIA_API_KEY
                api: openai-completions
                baseURL: https://integrate.api.nvidia.com/v1
                models:
                  - id: nvidia/nemotron-3-ultra-550b-a55b
              mistral:
                apiKeyEnv: MISTRAL_API_KEY
                api: openai-completions
                baseURL: https://api.mistral.ai/v1
                models:
                  - id: mistral-medium-3-5
          SETTINGS

      - name: run the task
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TASK_ID: ${{ inputs.taskId }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: node scripts/executor.mjs

      - name: nothing outside plexus/ may have changed
        if: always()
        run: |
          # The executor is confined to plexus/. This checks the confinement
          # rather than trusting it: a task arriving from a messenger should
          # never be able to touch the workflow that runs it, the worker, or
          # anything else in this repository.
          changed=$(git status --porcelain | awk '{print $2}' | grep -v '^plexus/' || true)
          if [ -n "$changed" ]; then
            echo "ГРАНИЦА НАРУШЕНА — тронуто вне plexus/:"
            echo "$changed"
            exit 1
          fi
          echo "граница цела: изменения только внутри plexus/"
