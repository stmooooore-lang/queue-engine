name: Task Executor

# Runs one queued task from Turso and reports back to Telegram.
#
# The script lives in scripts/executor.mjs, not inline. It was inlined under
# `run: node -e "` and YAML stopped parsing at the first colon inside the
# JavaScript: three runs failed before a job was even created, which is why
# those failures had no logs and no steps to look at.

on:
  workflow_dispatch:
    inputs:
      taskId:
        description: 'Task id to execute'
        required: true

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install the database client
        run: npm install --no-save @libsql/client

      - name: run the task
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TASK_ID: ${{ inputs.taskId }}
        run: node scripts/executor.mjs

      - name: nothing outside plexus/ may have changed
        if: always()
        run: |
          # The executor is confined to plexus/. This checks the confinement
          # rather than trusting it: a task arriving from a messenger should
          # never be able to touch the workflow that runs it, the worker, or
          # anything else in this repository.
          changed=$(git status --porcelain | awk '{print $2}' | grep -v '^plexus/' || true)
          if [ -n "$changed" ]; then
            echo "ГРАНИЦА НАРУШЕНА — тронуто вне plexus/:"
            echo "$changed"
            exit 1
          fi
          echo "граница цела: изменения только внутри plexus/"
