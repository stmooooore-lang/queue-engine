name: Task Executor

# Runs one queued task from Turso and reports back to Telegram.
#
# The script lives in scripts/executor.mjs, not inline. It was inlined under
# `run: node -e "` and YAML stopped parsing at the first colon inside the
# JavaScript: three runs failed before a job was even created, which is why
# those failures had no logs and no steps to look at.

on:
  workflow_dispatch:
    inputs:
      taskId:
        description: 'Task id to execute'
        required: true

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install the database client
        run: npm install --no-save @libsql/client

      - name: run the task
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TASK_ID: ${{ inputs.taskId }}
        run: node scripts/executor.mjs
