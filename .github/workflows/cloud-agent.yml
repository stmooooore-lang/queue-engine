name: cloud-agent

# Third fix, 2026-08-20. The previous run passed the key with -k and cline sent
# it to OPENAI - the error said "find your API key at platform.openai.com".
# baseUrl is not settable by flag; it comes only from providers.json, and the
# minimal file written earlier was rejected silently. This one copies the exact
# shape of a working local file: lastUsedProvider at the top, and provider /
# headers / updatedAt / tokenSource inside settings.

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Task for the agent'
        required: true
        type: string

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: install cline
        run: npm i -g cline --silent

      # The lane map comes from the real config, not from one model wired by
      # hand. cloud-config.yaml is generated by make-cloud-config.py in the
      # environment project: the same seven lanes, the same fallbacks and the
      # same rpm/tpm measured from provider headers, every key replaced by
      # os.environ/<PROVIDER>_API_KEY. Until 2026-08-22 this job talked to
      # NVIDIA directly with a single model - which is the whole reason the
      # cloud agent was poorer than the local one. Neglect, not the cloud.
      #
      # A key a provider has no secret for simply yields a lane that fails and
      # falls back; the run does not stop for it.
      - name: proxy with the real lanes
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Pinned to the version that runs on the founder's Mac. The latest
          # release fails to start at all: proxy_cli.py line 1018 does a bare
          # `from proxy_server import (...)`, which resolves only when the
          # proxy package directory is on sys.path, and on the runner it is
          # not - ModuleNotFoundError, exit 1, run 32549839784. Pinning also
          # makes the cloud proxy the same build as the local one, which is
          # what "the same stack in the cloud" is supposed to mean.
          pip install --quiet "litellm[proxy]==1.83.9"
          python3 -c "import yaml;d=yaml.safe_load(open('cloud-config.yaml'));print('lanes:',sorted({m[\"model_name\"] for m in d[\"model_list\"]}))"
          nohup litellm --config cloud-config.yaml --port 4000 --host 127.0.0.1 --num_workers 1 > proxy.log 2>&1 &
          sleep 5
          # If the CLI died on import, say so here rather than after 120s of
          # polling a port nothing is listening on.
          grep -q "ModuleNotFoundError" proxy.log && { echo "прокси не стартовал:"; tail -20 proxy.log; exit 1; }
          for i in $(seq 1 40); do
            curl -fsS -m 3 http://127.0.0.1:4000/health/liveliness >/dev/null 2>&1 && { echo "proxy up after $((i*3))s"; exit 0; }
            sleep 3
          done
          echo "proxy did not come up"; tail -20 proxy.log; exit 1

      - name: provider config, exact shape of a working one
        run: |
          mkdir -p ~/.cline/data/settings
          python3 - <<'PY'
          import json, os, datetime
          cfg = {
            "version": 1,
            "lastUsedProvider": "openai-compatible",
            "providers": {"openai-compatible": {
                "settings": {
                    "provider": "openai-compatible",
                    "apiKey": "not-used-by-the-local-proxy",
                    "model": "plexus-act",
                    "baseUrl": "http://127.0.0.1:4000/v1",
                    "headers": {}},
                "updatedAt": datetime.datetime.utcnow().isoformat() + "Z",
                "tokenSource": "migration"}}}
          p = os.path.expanduser("~/.cline/data/settings/providers.json")
          open(p, "w").write(json.dumps(cfg))
          os.chmod(p, 0o600)
          PY
          python3 -c "import json,os;d=json.load(open(os.path.expanduser('~/.cline/data/settings/providers.json')));print('baseUrl:',d['providers']['openai-compatible']['settings']['baseUrl'])"

      - name: run the agent
        shell: bash
        env:
          PROMPT: ${{ inputs.prompt }}
        run: |
          set -o pipefail
          cline --cwd "$GITHUB_WORKSPACE" -P openai-compatible \
            -m plexus-act \
            --compaction off --retries 3 "$PROMPT" 2>&1 | tee agent-output.txt

      - name: the work itself, not the exit code
        if: always()
        run: |
          echo "--- hello.txt ---"
          cat hello.txt 2>/dev/null || echo "(hello.txt was never created)"

      - name: no key may leave in an artifact
        if: always()
        run: |
          grep -q 'nvapi-' agent-output.txt 2>/dev/null && { echo "KEY LEAKED"; exit 1; }
          echo "no key in output"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-agent-output
          path: agent-output.txt
