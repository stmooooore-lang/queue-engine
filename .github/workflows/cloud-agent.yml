name: cloud-agent

# No proxy: one provider, spoken natively. The proxy exists locally to route
# fourteen providers and fall back; here it only added ModuleNotFoundError.
#
# Two defects fixed after the first green-but-failed run, 2026-08-20:
#   * `| tee` returns tee's status, so the step exited 0 while cline had failed
#     with "You didn't provide an API key" and the whole run was marked success.
#     That is the exact substitution this project keeps catching in others.
#   * the key is passed with -k rather than through providers.json, which cline
#     did not read.

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Task for the agent'
        required: true
        type: string

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: install cline
        run: npm i -g cline --silent

      - name: run the agent
        shell: bash
        env:
          PROMPT: ${{ inputs.prompt }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -o pipefail   # without this, tee's zero hides cline's failure
          cline --cwd "$GITHUB_WORKSPACE" \
            -P openai-compatible \
            -k "$NVIDIA_API_KEY" \
            -m nvidia/nemotron-3-ultra-550b-a55b \
            --compaction off --retries 3 "$PROMPT" 2>&1 | tee agent-output.txt

      - name: the work itself, not the exit code
        if: always()
        run: |
          echo "--- files the agent left behind ---"
          ls -la "$GITHUB_WORKSPACE" | head -20
          echo "--- hello.txt ---"
          cat hello.txt 2>/dev/null || echo "(hello.txt was never created)"

      - name: no key may leave in an artifact
        if: always()
        run: |
          grep -q 'nvapi-' agent-output.txt 2>/dev/null && { echo "KEY LEAKED"; exit 1; }
          echo "no key in output"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-agent-output
          path: agent-output.txt
