name: cloud-agent

# Third fix, 2026-08-20. The previous run passed the key with -k and cline sent
# it to OPENAI - the error said "find your API key at platform.openai.com".
# baseUrl is not settable by flag; it comes only from providers.json, and the
# minimal file written earlier was rejected silently. This one copies the exact
# shape of a working local file: lastUsedProvider at the top, and provider /
# headers / updatedAt / tokenSource inside settings.

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Task for the agent'
        required: true
        type: string

jobs:
  run-agent:
    runs-on: ubuntu-latest
    # 30 was too tight for a task that provisions infrastructure over SSH
    # (VM create + scp + remote docker build), not just editing files -
    # it killed the GCP e2-micro deploy run mid-build on 2026-08-23.
    timeout-minutes: 50
    # Needed to push the commit step below makes. Missing until 2026-08-23:
    # the agent wrote and locally committed a working render-service/ (proven
    # by its own local test - GET /test returned {"answer":"привет"}), and the
    # commit died with the runner because nothing pushed it. checkout@v4's
    # default token can push once the job is allowed to ask for write access.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Read+write access to plexus-doc itself, not just its partial mirror
      # in this repo - decided 2026-08-23, implemented 2026-08-24 once
      # hosting was solved. REPO_TOKEN is a PAT scoped for this; checkout@v4
      # persists its credentials into ./plexus-doc's git config, so a plain
      # `git push` from inside that directory later in the job just works.
      - uses: actions/checkout@v4
        with:
          repository: stmooooore-lang/plexus-doc
          token: ${{ secrets.REPO_TOKEN }}
          path: plexus-doc
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: install cline
        run: npm i -g cline

      # Plain bash, no LLM - deploying the worker and clearing a stale test
      # row are both fully mechanical. Found 2026-08-24: worker/index.js
      # changes had been committed all day on the false assumption that
      # Cloudflare Workers Builds auto-deploys on push - it does not, this
      # worker is `wrangler deploy` only, and the live bot had been running
      # stale code (no plain-text handling) the whole time despite several
      # merged commits. This step runs on every dispatch from now on so a
      # worker change can never again sit committed-but-not-live silently.
      - name: deploy the worker, clear stale test tasks
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/worker"
          npx --yes wrangler@latest deploy
          cd "$GITHUB_WORKSPACE"
          npm install --no-save @libsql/client --silent
          node -e '
            const { createClient } = require("@libsql/client");
            const db = createClient({ url: process.env.TURSO_DATABASE_URL, authToken: process.env.TURSO_AUTH_TOKEN });
            db.execute({ sql: "DELETE FROM tasks WHERE id = ?", args: [29] })
              .then(r => console.log("cleared task 29, rows affected:", r.rowsAffected))
              .catch(e => { console.error("cleanup failed:", e.message); process.exit(1); });
          '

      # The lane map comes from the real config, not from one model wired by
      # hand. cloud-config.yaml is generated by make-cloud-config.py in the
      # environment project: the same seven lanes, the same fallbacks and the
      # same rpm/tpm measured from provider headers, every key replaced by
      # os.environ/<PROVIDER>_API_KEY. Until 2026-08-22 this job talked to
      # NVIDIA directly with a single model - which is the whole reason the
      # cloud agent was poorer than the local one. Neglect, not the cloud.
      #
      # A key a provider has no secret for simply yields a lane that fails and
      # falls back; the run does not stop for it.
      - name: proxy with the real lanes
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VERTEX_PROJECT: ${{ secrets.VERTEX_PROJECT }}
          VERTEX_CREDENTIALS_JSON: ${{ secrets.VERTEX_CREDENTIALS_JSON }}
        run: |
          # Pinned to the version that runs on the founder's Mac. The latest
          # release fails to start at all: proxy_cli.py line 1018 does a bare
          # `from proxy_server import (...)`, which resolves only when the
          # proxy package directory is on sys.path, and on the runner it is
          # not - ModuleNotFoundError, exit 1, run 32549839784. Pinning also
          # makes the cloud proxy the same build as the local one, which is
          # what "the same stack in the cloud" is supposed to mean.
          pip install --quiet "litellm[proxy]==1.83.9"
          python3 -c "import yaml;d=yaml.safe_load(open('cloud-config.yaml'));print('lanes:',sorted({m[\"model_name\"] for m in d[\"model_list\"]}))"
          nohup litellm --config cloud-config.yaml --port 4000 --host 127.0.0.1 --num_workers 1 > proxy.log 2>&1 &
          sleep 5
          # If the CLI died on import, say so here rather than after 120s of
          # polling a port nothing is listening on.
          grep -q "ModuleNotFoundError" proxy.log && { echo "прокси не стартовал:"; tail -20 proxy.log; exit 1; }
          for i in $(seq 1 40); do
            curl -fsS -m 3 http://127.0.0.1:4000/health/liveliness >/dev/null 2>&1 && { echo "proxy up after $((i*3))s"; exit 0; }
            sleep 3
          done
          echo "proxy did not come up"; tail -20 proxy.log; exit 1

      - name: give the VM its own plexus-doc git credential
        # Plain bash, no LLM in this step - deliberately. REPO_TOKEN leaked
        # into the agent's own output three times on 2026-08-24 (an `env`
        # dump each time, despite explicit prompt instructions not to).
        # Instructing the model harder didn't fix it; removing the model
        # from this specific mechanical step does. Cline no longer receives
        # REPO_TOKEN at all (see the env block below) - by the time it runs,
        # the VM already has durable git access to plexus-doc via a
        # credential helper, set up here deterministically.
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GCP_SA_KEY" > /tmp/gcp-key.json
          gcloud auth activate-service-account --key-file=/tmp/gcp-key.json --project="$GCP_PROJECT_ID"
          # A freshly generated runner SSH key can take longer to propagate
          # to the VM's metadata than gcloud's own internal wait allows for
          # (run 32750131088: "Connection reset by peer" after 5+ minutes of
          # waiting, first SSH call in the job). Retry a few times with a
          # short pause rather than failing the whole step on one race.
          ssh_ok=0
          for i in 1 2 3 4 5; do
            gcloud compute ssh runner@plexus-queue-vm --zone=us-central1-a --project="$GCP_PROJECT_ID" --command='true' && { ssh_ok=1; break; }
            echo "SSH not ready yet (attempt $i/5), waiting 20s..."; sleep 20
          done
          # 5 retries (run 32750966164) still hit "Connection reset by peer"
          # for 26 minutes straight, ending in a hard timeout - that's not a
          # key-propagation race anymore, the VM itself was unresponsive
          # (likely from the day's repeated manual docker/systemctl work on
          # it). Self-heal once: hard reset and give it real boot time,
          # rather than failing the whole job and needing a second dispatch
          # just to do this.
          if [ "$ssh_ok" = "0" ]; then
            echo "SSH still not responding after 5 tries - resetting the VM and waiting for it to come back"
            gcloud compute instances reset plexus-queue-vm --zone=us-central1-a --project="$GCP_PROJECT_ID"
            sleep 90
            for i in 1 2 3 4 5 6; do
              gcloud compute ssh runner@plexus-queue-vm --zone=us-central1-a --project="$GCP_PROJECT_ID" --command='true' && { ssh_ok=1; break; }
              echo "still not up after reset (attempt $i/6), waiting 20s..."; sleep 20
            done
          fi
          [ "$ssh_ok" = "1" ] || { echo "VM unreachable even after a reset - stopping, this needs human attention"; exit 1; }
          # Token travels over SSH stdin only - never in a --command string,
          # never echoed, never landing in this job's own log.
          printf 'https://x-access-token:%s@github.com\n' "$REPO_TOKEN" | \
            gcloud compute ssh runner@plexus-queue-vm --zone=us-central1-a --project="$GCP_PROJECT_ID" \
            --command='git config --global credential.helper store && cat > ~/.git-credentials && chmod 600 ~/.git-credentials && echo CREDENTIAL_WRITTEN'
          gcloud compute ssh runner@plexus-queue-vm --zone=us-central1-a --project="$GCP_PROJECT_ID" \
            --command='if [ -d /home/runner/plexus-doc/.git ]; then cd /home/runner/plexus-doc && git fetch origin && git reset --hard origin/main; else git clone https://github.com/stmooooore-lang/plexus-doc.git /home/runner/plexus-doc; fi'
          echo "plexus-doc is live on the VM with a durable credential"

      - name: restore LITELLM_MASTER_KEY on the VM poller, mechanically
        # 2026-08-28: a manual VM fix session overwrote /run/secrets/poller.env
        # wholesale (single-line `echo ... > file` while fixing the Telegram
        # bot token), silently wiping TURSO_DATABASE_URL, TURSO_AUTH_TOKEN and
        # LITELLM_MASTER_KEY - poller crash-looped on "Missing required
        # secret: TURSO_DATABASE_URL" for a while before anyone noticed,
        # because poller.service isn't monitored. TURSO_*/TELEGRAM_BOT_TOKEN
        # are the founder's own to restore (he knows where they're kept);
        # LITELLM_MASTER_KEY was only ever set up from this side, so this
        # step upserts just that one line - plain bash, reusing the SSH
        # session the credential step above already established, secret
        # piped straight to a remote temp file and never appears in a
        # --command string, a log line, or Cline's own env/output.
        if: always()
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$LITELLM_MASTER_KEY" | \
            gcloud compute ssh runner@plexus-queue-vm --zone=us-central1-a --project="$GCP_PROJECT_ID" \
            --command='cat > /tmp/litellm_master_key.txt'
          gcloud compute ssh runner@plexus-queue-vm --zone=us-central1-a --project="$GCP_PROJECT_ID" \
            --command='sudo bash -c "test -f /run/secrets/poller.env && grep -v \"^LITELLM_MASTER_KEY=\" /run/secrets/poller.env > /tmp/poller.env.tmp || true; echo \"LITELLM_MASTER_KEY=\$(cat /tmp/litellm_master_key.txt)\" >> /tmp/poller.env.tmp; mv /tmp/poller.env.tmp /run/secrets/poller.env; chmod 600 /run/secrets/poller.env; chown runner:runner /run/secrets/poller.env; rm -f /tmp/litellm_master_key.txt; echo LITELLM_MASTER_KEY_RESTORED"'
          echo "LITELLM_MASTER_KEY upserted into /run/secrets/poller.env on the VM (value never logged)"

      - name: provider config, exact shape of a working one
        run: |
          mkdir -p ~/.cline/data/settings
          python3 - <<'PY'
          import json, os, datetime
          cfg = {
            "version": 1,
            "lastUsedProvider": "openai-compatible",
            "providers": {"openai-compatible": {
                "settings": {
                    "provider": "openai-compatible",
                    "apiKey": "not-used-by-the-local-proxy",
                    "model": "plexus-act",
                    "baseUrl": "http://127.0.0.1:4000/v1",
                    "headers": {}},
                "updatedAt": datetime.datetime.utcnow().isoformat() + "Z",
                "tokenSource": "migration"}}}
          p = os.path.expanduser("~/.cline/data/settings/providers.json")
          open(p, "w").write(json.dumps(cfg))
          os.chmod(p, 0o600)
          PY
          python3 -c "import json,os;d=json.load(open(os.path.expanduser('~/.cline/data/settings/providers.json')));print('baseUrl:',d['providers']['openai-compatible']['settings']['baseUrl'])"

      - name: run the agent
        shell: bash
        env:
          PROMPT: ${{ inputs.prompt }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -o pipefail
          cline --cwd "$GITHUB_WORKSPACE" -P openai-compatible \
            -m plexus-act \
            --compaction off --retries 3 "$PROMPT" 2>&1 | tee agent-output.txt

      - name: the work itself, not the exit code
        if: always()
        run: |
          echo "--- hello.txt ---"
          cat hello.txt 2>/dev/null || echo "(hello.txt was never created)"

      - name: no key may leave in an artifact
        if: always()
        run: |
          grep -q 'nvapi-' agent-output.txt 2>/dev/null && { echo "KEY LEAKED"; exit 1; }
          grep -q 'hf_[A-Za-z0-9]' agent-output.txt 2>/dev/null && { echo "KEY LEAKED"; exit 1; }
          grep -q 'BEGIN PRIVATE KEY\|"private_key"\|"private_key_id"' agent-output.txt 2>/dev/null && { echo "KEY LEAKED"; exit 1; }
          grep -qE '[0-9]{8,10}:[A-Za-z0-9_-]{35}' agent-output.txt 2>/dev/null && { echo "KEY LEAKED"; exit 1; }
          grep -qE 'ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}' agent-output.txt 2>/dev/null && { echo "KEY LEAKED"; exit 1; }
          echo "no key in output"

      - name: push whatever the agent committed
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          # The agent may have already run its own `git commit` (it was asked
          # to). Catch anything still uncommitted too, so a turn that did the
          # work but skipped the commit step doesn't lose it the same way.
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "plexus-cloud-agent"
            git config user.email "noreply@queue-engine"
            git add render-service/ scripts/ worker/ plexus/ *.md *.yaml *.yml 2>/dev/null || true
            # git add above may match nothing (e.g. only ignored build
            # artifacts are untracked) - guard the commit so that case can't
            # abort this step under `bash -e`.
            git diff --cached --quiet || git commit -q -m "cloud-agent: uncommitted changes from this run (task not committed by the agent itself)"
          fi
          ahead=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo 0)
          if [ "$ahead" = "0" ]; then
            echo "nothing to push"
          else
            git push origin HEAD:main
            echo "pushed $ahead commit(s)"
          fi

      - name: push whatever the agent changed in plexus-doc
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/plexus-doc"
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "plexus-cloud-agent"
            git config user.email "noreply@queue-engine"
            git add -A
            git diff --cached --quiet || git commit -q -m "cloud-agent: uncommitted changes from this run (task not committed by the agent itself)"
          fi
          ahead=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo 0)
          if [ "$ahead" = "0" ]; then
            echo "nothing to push in plexus-doc"
          # plexus-doc's own rule (CLAUDE.md): site/, worker/, wrangler.jsonc
          # auto-deploy the live trading site on merge to main. The cloud
          # agent may write freely everywhere else (canon/ additively,
          # notes/, docs/) but must never be the one that ships a release -
          # that stays the founder's call, on a branch until they say so.
          elif git diff origin/main..HEAD --name-only | grep -qE '^(site/|worker/|wrangler\.jsonc$)'; then
            branch="cloud-agent/review-$(date -u +%Y%m%d-%H%M%S)"
            git push origin "HEAD:$branch"
            echo "::warning::plexus-doc changes touch site/worker/wrangler.jsonc (a release surface) - pushed to $branch instead of main. Founder must review and merge by hand."
          else
            git push origin HEAD:main
            echo "pushed $ahead commit(s) to plexus-doc main"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-agent-output
          path: agent-output.txt
