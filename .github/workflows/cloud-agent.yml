name: cloud-agent

# No proxy on the runner. LiteLLM exists locally to route between fourteen
# providers and to fall back when one dies; in the cloud there is exactly one
# provider, and NVIDIA speaks the OpenAI protocol directly. Installing a proxy
# to reach a single endpoint added a Python install, a port, a readiness wait
# and a whole class of failure - it failed on the first run with
# ModuleNotFoundError: No module named 'proxy_server'. Removed rather than fixed.

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Task for the agent'
        required: true
        type: string

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}

      - name: install cline
        run: npm i -g cline --silent

      - name: point cline straight at NVIDIA
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          mkdir -p ~/.cline/data/settings
          python3 - <<'PY'
          import json, os
          cfg = {"version": 1, "providers": {"openai-compatible": {"settings": {
              "apiKey": os.environ["NVIDIA_API_KEY"],
              "baseUrl": "https://integrate.api.nvidia.com/v1",
              "model": "nvidia/nemotron-3-ultra-550b-a55b"}}}}
          p = os.path.expanduser("~/.cline/data/settings/providers.json")
          open(p, "w").write(json.dumps(cfg))
          os.chmod(p, 0o600)
          PY
          echo "provider config written, $(wc -c < ~/.cline/data/settings/providers.json) bytes"

      - name: run the agent
        env:
          PROMPT: ${{ inputs.prompt }}
        run: |
          cline --cwd "$GITHUB_WORKSPACE" -P openai-compatible \
            -m nvidia/nemotron-3-ultra-550b-a55b \
            --compaction off --retries 3 "$PROMPT" 2>&1 | tee agent-output.txt

      - name: no key may leave in an artifact
        if: always()
        run: |
          if grep -q 'nvapi-' agent-output.txt 2>/dev/null; then
            echo "KEY LEAKED"; exit 1
          fi
          echo "no key in output"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-agent-output
          path: agent-output.txt
